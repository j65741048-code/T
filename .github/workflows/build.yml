          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.Redirect;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(BogeyRenderer.class)
          public class BogeyRendererMixin {

              @Inject(method = "render", at = @At("HEAD"), remap = false, require = 0)
              private void createdyedtracks$readBogeyDataColor(
                  CompoundTag bogeyData, float wheelAngle, float partialTick,
                  PoseStack poseStack, MultiBufferSource bufferSource,
                  int packedLight, int packedOverlay, boolean inContraption, CallbackInfo ci
              ) {
                  if (bogeyData != null && bogeyData.contains("CreateDyedTracksWheelColor")) {
                      DyeColor color = DyeColor.byName(bogeyData.getString("CreateDyedTracksWheelColor"), null);
                      if (color != null) {
                          RenderColorContext.setBogeyColor(color);
                      }
                  }
              }

              @Redirect(
                  method = "*",
                  at = @At(
                      value = "INVOKE",
                      target = "Lnet/createmod/catnip/render/CachedBuffers;partial(Ldev/engine_room/flywheel/lib/model/baked/PartialModel;Lnet/minecraft/world/level/block/state/BlockState;)Lnet/createmod/catnip/render/SuperByteBuffer;"
                  ),
                  remap = false,
                  require = 0
              )
              private SuperByteBuffer createdyedtracks$tintBogeyWheelsOnly(PartialModel partial, BlockState state) {
                  SuperByteBuffer buffer = CachedBuffers.partial(partial, state);
                  DyeColor color = RenderColorContext.getBogeyColor();
                  if (color != null && createdyedtracks$isWheelPartial(partial)) {
                      buffer.color(RenderColorContext.getVibrantRgb(color));
                  }
                  return buffer;
              }

              private static boolean createdyedtracks$isWheelPartial(PartialModel partial) {
                  if (partial == null) return false;
                  if (partial == AllPartialModels.SMALL_BOGEY_WHEELS
                      || partial == AllPartialModels.LARGE_BOGEY_WHEELS
                      || partial == AllPartialModels.BOGEY_DRIVE) {
                      return true;
                  }
                  String path = partial.modelLocation().getPath();
                  return path.contains("wheel") || path.contains("drive");
              }
          }
